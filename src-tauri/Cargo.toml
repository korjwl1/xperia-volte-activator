[package]
name = "xperia-volte-activator"
version = "0.1.0"
description = "Xperia VoLTE Activator"
authors = ["korjwl1"]
edition = "2021"
# vendor/adb_client(1.88)·is_multiple_of(1.87) 기준 최소 Rust 버전
rust-version = "1.88"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "xperia_volte_activator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# ADB 프로토콜 순수 Rust 구현 — adb 바이너리 설치/경로 탐색 불필요
adb_client = { version = "3.2.3", default-features = false, features = ["usb"] }
tauri-plugin-dialog = "2"
fs2 = "0.4"
rsa = { version = "0.9.10", features = ["pem"] }
ureq = "2"
flate2 = "1"
tar = "0.4"
crc32fast = "1"
roxmltree = "0.20"
rusb = { version = "0.9.4", features = ["vendored"] }
# 백업 엔진 (§6) — 해시 동시 계산, mtime 보존, manifest 타임스탬프
sha2 = "0.10"
hex = "0.4"
filetime = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serialport = { version = "4", default-features = false }

[dev-dependencies]
tempfile = "3"

[features]
# 실기기 검증 전에는 직접 invoke도 쓰기/재부팅을 실행할 수 없다.
default = []
fastboot-write = []
root-write = []
efs-write = []


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# 작업 중 절전·Windows 종료 방지 (guard.rs)
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Power", "Win32_System_Threading", "Win32_System_Shutdown", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Registry"] }

# adb_client 3.2.3에 I/O 시간 상한을 넣은 사본 (원본은 USB 읽기·서버 소켓 상한이 없어 기기가 멈추면
# 실행권·연결 잠금을 앱 재시작까지 잡는다). 변경 목록은 vendor/adb_client/PATCHES.md.
[patch.crates-io]
adb_client = { path = "vendor/adb_client" }
